<!DOCTYPE html>
<html lang="uk" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"БЕШКЕТ"</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for Editorial feel -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        newspaper: ['"Playfair Display"', 'serif'],
                        body: ['Lora', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        paper: '#fdfbf7',
                        ink: '#1c1917',
                        aged: '#f4ede2',
                        sepia: '#e2d4bc',
                        accent: '#991b1b',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #e5e0d8;
            background-image: radial-gradient(#d1c7bc 0.75px, transparent 0.75px), radial-gradient(#d1c7bc 0.75px, #e5e0d8 0.75px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .book-container {
            perspective: 2500px;
        }

        .newspaper-spread {
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.8s ease;
        }

        .page-shadow {
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.18), 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f4ede2;
        }

        ::-webkit-scrollbar-thumb {
            background: #c8b9a6;
            border-radius: 3px;
        }

        @keyframes pageTurnSmooth {
            0% {
                opacity: 0.2;
                transform: rotateY(15deg) scale(0.98);
            }
            100% {
                opacity: 1;
                transform: rotateY(0deg) scale(1);
            }
        }

        .page-turn-anim {
            animation: pageTurnSmooth 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>

<body class="h-full flex flex-col font-body text-ink antialiased selection:bg-accent selection:text-white">

    <header class="bg-paper border-b border-stone-300 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <h1 class="font-newspaper text-2xl font-bold tracking-tight text-ink flex items-center gap-2">
                    БЕШКЕТ
                </h1>
            </div>

            <div class="flex items-center space-x-4">
                <div id="auth-status" class="text-sm font-sans flex items-center gap-2 bg-stone-100 px-3 py-1.5 rounded-full border border-stone-200">
                    <i class="fa-regular fa-user text-stone-500"></i>
                    <span id="current-user-display" class="font-medium text-stone-700">Гість</span>
                </div>

                <button onclick="openAuthModal()" class="bg-stone-800 hover:bg-stone-900 text-white font-sans text-xs px-4 py-2 rounded-md transition shadow hover:shadow-md flex items-center gap-1.5">
                    <i class="fa-solid fa-key"></i> <span id="auth-btn-text">Доступ редактора</span>
                </button>

                <button id="add-article-btn" onclick="openEditorModal()" class="hidden bg-accent hover:bg-red-800 text-white font-sans text-xs px-4 py-2 rounded-md transition shadow hover:shadow-md flex items-center gap-1.5 animate-pulse">
                    <i class="fa-solid fa-plus"></i> Додати новину
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col justify-center items-center">
        <div class="w-full max-w-5xl flex flex-wrap items-center justify-between mb-6 bg-paper/90 backdrop-blur p-3 rounded-lg border border-stone-300 shadow-sm">
            <div class="flex items-center space-x-2 text-sm font-sans text-stone-600">
                <span class="font-medium">БЕШКЕТ</span>
            </div>

            <div class="flex items-center space-x-3">
                <button onclick="prevSpread()" id="prev-btn" class="px-3.5 py-1.5 bg-stone-200 hover:bg-stone-300 text-stone-800 rounded text-xs font-sans font-semibold transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1">
                    <i class="fa-solid fa-chevron-left"></i> ПОЧАТОК
                </button>
                <span id="page-indicator" class="font-mono text-xs text-stone-600 px-2 font-semibold">Сторінка 1 / 1</span>
                <button onclick="nextSpread()" id="next-btn" class="px-3.5 py-1.5 bg-stone-200 hover:bg-stone-300 text-stone-800 rounded text-xs font-sans font-semibold transition disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1">
                    ДАЛІ <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <div class="book-container w-full max-w-5xl aspect-[4/2.6] bg-paper page-shadow rounded-sm border border-stone-300 relative flex overflow-hidden">
            <div id="left-page" class="newspaper-spread w-1/2 h-full p-8 border-r border-stone-300 bg-[#fefdfa] overflow-y-auto flex flex-col justify-between relative selection:bg-accent selection:text-white"></div>
            <div id="right-page" class="newspaper-spread w-1/2 h-full p-8 bg-[#fdfbf7] overflow-y-auto flex flex-col justify-between relative selection:bg-accent selection:text-white"></div>
            <div class="absolute left-1/2 top-0 bottom-0 w-8 -ml-4 pointer-events-none bg-gradient-to-r from-transparent via-black/10 to-transparent z-10"></div>
        </div>
    </main>

    <!-- Модальне вікно авторизації -->
    <div id="auth-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-paper rounded-lg max-w-md w-full p-6 shadow-2xl border border-stone-400 relative font-sans">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-700">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="text-center mb-6">
                <h3 class="font-newspaper text-2xl font-bold text-ink">Доступ редактора новин</h3>
                <p class="text-xs text-stone-600 mt-1">Введіть вашу електронну пошту.</p>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Email адреса</label>
                    <input type="email" id="editor-email" required placeholder="editor@school.ua" class="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-accent bg-stone-50">
                </div>
                <button type="submit" class="w-full bg-stone-900 hover:bg-stone-800 text-white font-medium py-2.5 rounded text-sm transition shadow">Підтвердити</button>
            </form>
            <div id="logout-section" class="mt-4 pt-4 border-t border-stone-200 hidden">
                <button onclick="handleLogout()" class="w-full bg-red-100 hover:bg-red-200 text-accent font-medium py-2 rounded text-sm transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-from-bracket"></i> Вийти з акаунту редактора
                </button>
            </div>
        </div>
    </div>

    <!-- Модальне вікно редагування статті -->
    <div id="article-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-paper rounded-lg max-w-2xl w-full p-6 shadow-2xl border border-stone-400 relative font-sans my-8">
            <button onclick="closeEditorModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-700"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div class="mb-6"><h3 id="modal-title" class="font-newspaper text-2xl font-bold text-ink">Додати новину</h3></div>
            <form id="article-form" onsubmit="saveArticle(event)" class="space-y-4">
                <input type="hidden" id="article-id">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Заголовок статті</label>
                    <input type="text" id="article-title" required class="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-accent bg-stone-50">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Автор</label>
                    <input type="text" id="article-author" required placeholder="Ваше ім'я" class="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-accent bg-stone-50">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">URL фото</label>
                    <input type="url" id="article-image" placeholder="https://..." class="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-accent bg-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Текст статті</label>
                    <textarea id="article-content" rows="6" required class="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:border-accent bg-stone-50"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-3 border-t border-stone-200">
                    <button type="button" onclick="closeEditorModal()" class="px-4 py-2 bg-stone-200 hover:bg-stone-300 text-stone-700 rounded text-sm font-medium transition">Скасувати</button>
                    <button type="submit" id="publish-btn" class="px-5 py-2 bg-accent hover:bg-red-800 text-white rounded text-sm font-medium transition shadow">Опублікувати</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Сповіщення -->
    <div id="alert-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-paper rounded-lg max-w-sm w-full p-6 shadow-2xl border border-stone-400 text-center font-sans">
            <h4 id="alert-title" class="font-bold text-lg text-ink mb-1">Сповіщення</h4>
            <p id="alert-message" class="text-sm text-stone-600 mb-5">Повідомлення...</p>
            <button onclick="closeAlertModal()" class="w-full bg-stone-900 text-white py-2 rounded text-sm font-medium hover:bg-stone-800 transition">Зрозуміло</button>
        </div>
    </div>

    <script>
        // --- НАЛАШТУВАННЯ TELEGRAM ---
        const TELEGRAM_BOT_TOKEN = "8817346308:AAHNNubomwJ4qsBy1u-15kU6mOHHRM7Hob8"; // наприклад: "123456789:ABCdef..."
        const TELEGRAM_CHAT_ID = "-1004350829549";     // наприклад: "@beshket_school" або "-100..."

        const allowedEditors = ["sofia.prystupa2000@gmail.com", "werteyegor@gmail.com", "president@school.ua"];
        let articles = [];
        let currentEditorEmail = localStorage.getItem('school_news_user') || null;
        let currentSpreadIndex = 0;

        window.onload = function () {
            updateAuthUI();
            fetchArticlesFromTelegram();
        };

        function showAlert(title, message) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('alert-modal').classList.remove('hidden');
        }
        function closeAlertModal() { document.getElementById('alert-modal').classList.add('hidden'); }
        function openAuthModal() { 
            document.getElementById('auth-modal').classList.remove('hidden');
            if(currentEditorEmail) document.getElementById('logout-section').classList.remove('hidden');
        }
        function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('editor-email').value.trim().toLowerCase();
            if (!allowedEditors.includes(email)) {
                showAlert('Доступ заборонено', 'Ця адреса не має прав редактора.');
                return;
            }
            currentEditorEmail = email;
            localStorage.setItem('school_news_user', email);
            closeAuthModal();
            updateAuthUI();
            showAlert('Успішно!', 'Права редактора активовано.');
        }

        function handleLogout() {
            currentEditorEmail = null;
            localStorage.removeItem('school_news_user');
            closeAuthModal();
            updateAuthUI();
            showAlert('Вихід виконано', 'Ви вийшли з акаунта.');
        }

        function updateAuthUI() {
            document.getElementById('current-user-display').innerText = currentEditorEmail || 'Гість';
            document.getElementById('add-article-btn').classList.toggle('hidden', !currentEditorEmail);
        }

        // ЗАВАНТАЖЕННЯ СТАТТІВ ІЗ TELEGRAM КАНАЛУ
        async function fetchArticlesFromTelegram() {
            if (TELEGRAM_BOT_TOKEN.includes("ВСТАВТЕ")) {
                // Якщо токени ще не ввели, показуємо заглушку
                articles = [{ id: 'news-1', title: 'Ласкаво просимо до газети "БЕШКЕТ"', author: 'Редакція', date: '9 жовтня 2026', image: '', content: 'Будь ласка, налаштуйте токен Telegram-бота у коді сайту, щоб завантажувати новини з каналу.' }];
                renderNewspaper();
                return;
            }

            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates`);
                const data = await response.json();
                
                if (!data.ok) throw new Error('Помилка Telegram API');

                let loadedArticles = [];
                
                // Перебираємо повідомлення з каналу/чату
                data.result.forEach(item => {
                    const msg = item.channel_post || item.message;
                    if (msg && msg.text && msg.text.startsWith("BESHKE_NEWS:")) {
                        try {
                            // Розкодовуємо JSON-об'єкт статті з тексту повідомлення
                            const jsonString = msg.text.replace("BESHKE_NEWS:", "");
                            const articleData = JSON.parse(jsonString);
                            articleData.tgMessageId = msg.message_id; // зберігаємо ID для можливого видалення
                            loadedArticles.push(articleData);
                        } catch (e) {
                            console.error("Помилка розбору статті", e);
                        }
                    }
                });

                articles = loadedArticles.reverse(); // нові зверху
                if (articles.length === 0) {
                    articles = [{ id: 'news-1', title: 'Поки що немає новин', author: 'Редакція', date: '', image: '', content: 'Очікуйте на свіжі випуски газети у нашому Telegram-каналі!' }];
                }
                renderNewspaper();
            } catch (error) {
                console.error(error);
                showAlert('Помилка', 'Не вдалося завантажити новини з Telegram.');
            }
        }

        function renderNewspaper() {
            const itemsPerPage = 2;
            const totalSpreads = Math.max(1, Math.ceil(articles.length / itemsPerPage));
            if (currentSpreadIndex >= totalSpreads) currentSpreadIndex = Math.max(0, totalSpreads - 1);

            document.getElementById('page-indicator').innerText = `Сторінка ${currentSpreadIndex + 1} / ${totalSpreads}`;
            document.getElementById('prev-btn').disabled = currentSpreadIndex === 0;
            document.getElementById('next-btn').disabled = currentSpreadIndex >= totalSpreads - 1;

            const leftContainer = document.getElementById('left-page');
            const rightContainer = document.getElementById('right-page');

            const startIndex = currentSpreadIndex * itemsPerPage;
            leftContainer.innerHTML = articles[startIndex] ? generateArticleHTML(articles[startIndex], startIndex + 1) : generateEmptyPageHTML();
            rightContainer.innerHTML = articles[startIndex + 1] ? generateArticleHTML(articles[startIndex + 1], startIndex + 2) : generateEmptyPageHTML();
        }

        function generateArticleHTML(article, pageNum) {
            const isEditor = currentEditorEmail !== null;
            return `
                <div class="space-y-4">
                    <div class="flex justify-between items-center border-b border-stone-200 pb-2">
                        <span class="text-xs font-mono text-stone-500">${article.date || ''}</span>
                        <span class="text-xs font-mono text-stone-400">Сторінка ${pageNum}</span>
                    </div>
                    <h2 class="font-newspaper text-2xl font-extrabold text-ink leading-tight">${article.title}</h2>
                    ${article.author ? `<div class="text-xs text-stone-600 italic"><i class="fa-solid fa-pen-nib text-accent"></i> ${article.author}</div>` : ''}
                    ${article.image ? `<div class="my-3 overflow-hidden rounded border border-stone-300"><img src="${article.image}" class="w-full h-52 object-cover"></div>` : ''}
                    <div class="font-body text-stone-800 text-sm leading-relaxed whitespace-pre-line text-justify">${article.content}</div>
                </div>
                <div class="mt-8 pt-4 border-t border-stone-200 flex justify-end items-center text-xs">
                    ${isEditor && article.tgMessageId ? `<button onclick="deleteArticle('${article.tgMessageId}')" class="bg-red-100 text-accent px-2.5 py-1 rounded transition hover:bg-red-200"><i class="fa-solid fa-trash"></i> Видалити</button>` : ''}
                </div>
            `;
        }

        function generateEmptyPageHTML() {
            return `<div class="h-full flex items-center justify-center text-center p-8 text-stone-400 font-newspaper italic">Очікуйте на нові статті</div>`;
        }

        function nextSpread() { currentSpreadIndex++; renderNewspaper(); }
        function prevSpread() { currentSpreadIndex--; renderNewspaper(); }
        function openEditorModal() { document.getElementById('article-modal').classList.remove('hidden'); }
        function closeEditorModal() { document.getElementById('article-modal').classList.add('hidden'); }

        // ПУБЛІКАЦІЯ НОВОЇ СТАТТІ В TELEGRAM КАНАЛ
        async function saveArticle(event) {
            event.preventDefault();
            if (TELEGRAM_BOT_TOKEN.includes("ВСТАВТЕ")) {
                showAlert('Помилка', 'Спочатку налаштуйте токен бота у коді!');
                return;
            }

            const publishBtn = document.getElementById('publish-btn');
            publishBtn.innerText = 'Публікація в Telegram...';
            publishBtn.disabled = true;

            const newArticle = {
                id: 'news-' + Date.now(),
                title: document.getElementById('article-title').value.trim(),
                author: document.getElementById('article-author').value.trim(),
                date: new Date().toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' }),
                image: document.getElementById('article-image').value.trim(),
                content: document.getElementById('article-content').value.trim()
            };

            // Формуємо прихований префікс, щоб сайт розпізнавав повідомлення як статтю газети
            const messageText = `BESHKE_NEWS:` + JSON.stringify(newArticle);

            try {
                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: messageText
                    })
                });

                const result = await response.json();
                if (!result.ok) throw new Error(result.description || 'Помилка надсилання');

                publishBtn.innerText = 'Опублікувати';
                publishBtn.disabled = false;
                closeEditorModal();
                showAlert('Успіх!', 'Статтю успішно надіслано в Telegram-канал і опубліковано на сайті.');
                
                // Перезавантажуємо новини з каналу
                fetchArticlesFromTelegram();
            } catch (error) {
                console.error(error);
                publishBtn.innerText = 'Опублікувати';
                publishBtn.disabled = false;
                showAlert('Помилка', 'Не вдалося надіслати статтю в Telegram. Перевірте, чи бот є адміністратором каналу.');
            }
        }

        // ВИДАЛЕННЯ СТАТТІ З TELEGRAM
        async function deleteArticle(messageId) {
            if (confirm('Видалити цю статтю з Telegram-каналу та сайту?')) {
                try {
                    await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            message_id: Number(messageId)
                        })
                    });
                    showAlert('Видалено', 'Статтю успішно видалено.');
                    fetchArticlesFromTelegram();
                } catch (e) {
                    console.error(e);
                    showAlert('Помилка', 'Не вдалося видалити повідомлення.');
                }
            }
        }
    </script>
</body>
</html>
